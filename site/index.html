<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valued Agent Reseller: AI agents by the job they do</title>
<meta name="description" content="Find an AI agent by the job you want done, read what it did for people like you, and get help running it. Operated by Brine AI, which is listed like any other provider.">
<link rel="canonical" href="https://valuedagentreseller.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Valued Agent Reseller">
<meta property="og:title" content="Valued Agent Reseller: AI agents by the job they do">
<meta property="og:description" content="Find an AI agent by the job you want done, read what it did for people like you, and get help running it.">
<meta property="og:url" content="https://valuedagentreseller.com/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A1C20'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: calm, one column, generous whitespace. The site starts from the job,
   opens into the agents that do it and the stories of people who ran them. */
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --ink:#1A1C20; --muted:#6B7079; --faint:#A1A6AE; --line:#E6E8EC;
  --accent:#0A62D0; --accent-soft:#EAF2FD; --on-accent:#FFFFFF;
  --up:#1E9E5A; --up-soft:#E5F5EC; --down:#C2410C; --down-soft:#FDEEE6; --new:#0A62D0;
  --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --soft:#17191D; --ink:#F2F3F5; --muted:#9BA1AB; --faint:#5F6570; --line:#25282E;
  --accent:#5AA2FF; --accent-soft:#13243B; --on-accent:#0B0C0E;
  --up:#4ACF85; --up-soft:#12291C; --down:#FF8A4C; --down-soft:#2E1A10; --new:#5AA2FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --soft:#17191D; --ink:#F2F3F5; --muted:#9BA1AB; --faint:#5F6570; --line:#25282E;
  --accent:#5AA2FF; --accent-soft:#13243B; --on-accent:#0B0C0E;
  --up:#4ACF85; --up-soft:#12291C; --down:#FF8A4C; --down-soft:#2E1A10; --new:#5AA2FF;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em;font-weight:700}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15}
h3{font-size:17px;letter-spacing:-.01em}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:52px}
.mark{font-weight:700;letter-spacing:-.02em;color:var(--ink);font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.mark:hover{text-decoration:none}
.mark i{width:14px;height:14px;border-radius:4px;background:var(--ink);display:inline-block;position:relative}
.mark i::after{content:"";position:absolute;inset:4px;border-radius:1.5px;background:var(--bg)}
nav.main{margin-left:auto;display:flex;gap:22px}
nav.main a{font-size:13.5px;color:var(--muted);white-space:nowrap}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink);text-decoration:none}
@media (max-width:700px){ nav.main{gap:14px} nav.main a[data-nav="pulse"],nav.main a[data-nav="list"]{display:none} .mark span{display:none} }

main{padding-block:0 140px;min-height:70vh}

/* hero + job box */
.hero{text-align:center;padding:72px 0 28px}
.hero h1{max-width:18ch;margin:14px auto 0}
.hero p{max-width:46ch;margin:18px auto 0;font-size:19px;color:var(--muted);line-height:1.45}
form.jobbox{display:flex;flex-direction:row;gap:8px;max-width:620px;margin:30px auto 0;background:var(--soft);padding:6px;border-radius:999px}
.jobbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;padding:10px 16px;color:var(--ink)}
.jobbox input::placeholder{color:var(--faint)}
.jobnote{font-size:13.5px;color:var(--muted);margin-top:12px;min-height:20px}
.jobnote.ok{color:var(--up)}
.notify{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.notify input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;border-radius:999px;width:240px;max-width:100%}
@media (max-width:640px){ form.jobbox{border-radius:22px;flex-direction:column} .jobbox .btn{justify-content:center} }

/* job tiles */
.fn{margin-top:48px}
.fn h2{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.tile{display:block;color:var(--ink);background:var(--soft);border-radius:14px;padding:14px 16px;min-height:78px}
.tile:hover{text-decoration:none;background:var(--accent-soft)}
.tile b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.tile span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.tile.dim b{color:var(--muted);font-weight:500}
.tile.dim span{color:var(--faint)}
.tile.hit{outline:2px solid var(--accent)}

/* strip of this week's list */
.weekstrip{margin-top:64px;padding-top:28px;border-top:1px solid var(--line)}
.weekstrip .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.weekstrip .head a{font-size:14px}

/* periods + controls (full list page) */
.periods{display:inline-flex;gap:2px;padding:3px;background:var(--soft);border-radius:999px;margin-top:28px;max-width:100%;overflow-x:auto}
.periods button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.periods button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.periods button:disabled{cursor:default;opacity:.45}
.periodnote{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
.controls{display:flex;gap:10px;align-items:center;margin:20px 0 6px;flex-wrap:wrap}
.inds{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.inds::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--soft);padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;width:200px;max-width:100%}
.fbtn{border:0;background:var(--soft);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap}
.fbtn[aria-expanded="true"],.fbtn.has{background:var(--accent-soft);color:var(--accent)}
.fpanel{background:var(--soft);border-radius:var(--r);padding:20px;margin-top:10px;display:grid;gap:16px}
.fpanel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fpanel .lbl{font-size:13px;font-weight:600;color:var(--muted);width:90px;flex:none}
.opt{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.count{font-size:13px;color:var(--muted);margin:18px 0 4px;display:flex;justify-content:flex-end;gap:10px;min-height:18px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
@media (max-width:640px){ .search{flex:1;width:auto} }

/* list */
.list{position:relative}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) 150px 18px;gap:18px;align-items:center;padding:20px 4px;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);text-decoration:none}
.item:hover{text-decoration:none}
.item:hover .nm b{color:var(--accent)}
.item:last-child{border-bottom:1px solid var(--line)}
.rk{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rk b{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.item.top3 .rk b{font-size:34px}
.mv{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.mv.up{color:var(--up);background:var(--up-soft)}
.mv.down{color:var(--down);background:var(--down-soft)}
.mv.same{color:var(--faint)}
.mv.new{color:var(--new);background:var(--accent-soft)}
.nm{min-width:0}
.nm b{font-size:18px;font-weight:600;letter-spacing:-.015em;transition:color .15s}
.nm span{display:block;color:var(--muted);font-size:14.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.sc .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sc .v small{color:var(--muted);font-weight:400}
.sc .us{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--up);transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(.35)}to{transform:none}}
.chev{color:var(--faint);font-size:20px}
.empty{padding:64px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
@media (max-width:640px){
  .item{grid-template-columns:48px minmax(0,1fr) 72px;gap:12px;padding:16px 0}
  .chev{display:none}
  .rk b{font-size:22px} .item.top3 .rk b{font-size:26px}
  .nm b{font-size:16px} .nm span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}

/* compare tray */
.tray{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:25;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.7,.2,1);max-width:calc(100vw - 32px)}
.tray:not(.on){visibility:hidden;box-shadow:none}
.tray.on{transform:translate(-50%,0)}
.tray span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .x{border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;font-size:13px}
.btn{border:0;background:var(--accent);color:var(--on-accent);padding:10px 20px;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{text-decoration:none;filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.sm{font-size:13.5px;padding:7px 14px}

/* agent / job / story pages */
.back{display:inline-block;font-size:14px;margin:28px 0 0}
.ahead{padding:36px 0 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.ahead p{font-size:19px;color:var(--muted);max-width:52ch;margin:14px 0 0;line-height:1.45}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.acts a.txt{font-size:15px;margin-left:6px}
.big{text-align:right}
.big b{display:block;font-size:84px;font-weight:600;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.big span{font-size:14px;color:var(--muted)}
.big .ubig{margin-top:18px}
.big .ubig b{font-size:34px;letter-spacing:-.03em;line-height:1}
.big .ubig a{font-size:14px}
@media (max-width:700px){ .ahead{grid-template-columns:1fr} .big{text-align:left} .big b{font-size:64px} }
.jobtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.jobtag{font-size:13px;background:var(--soft);color:var(--ink);padding:5px 12px;border-radius:999px}
.jobtag:hover{background:var(--accent-soft);text-decoration:none}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:36px}
.strip>div{background:var(--soft);border-radius:14px;padding:14px 16px}
.strip .k{font-size:13px;color:var(--muted)}
.strip .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.strip .bar{margin-top:10px}
@media (max-width:700px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sec-block{margin-top:72px;scroll-margin-top:70px}
.sec-block>p.lead{color:var(--muted);margin:8px 0 0;max-width:60ch}
.tag-ns{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:999px;margin-left:10px;vertical-align:middle;letter-spacing:0}
.checks{margin-top:22px;border-top:1px solid var(--line)}
.ck{border-bottom:1px solid var(--line)}
.ck summary{list-style:none;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 2px;cursor:pointer}
.ck summary::-webkit-details-marker{display:none}
.ck summary.static{cursor:default}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.dot.y{background:var(--up);color:var(--bg)}
.dot.n{background:var(--soft);color:var(--faint)}
.ck .grp{font-size:12.5px;color:var(--faint)}
.ck .more{font-size:13px;color:var(--accent)}
.ck[open] .more::after{content:" ▴"} .ck:not([open]) .more::after{content:" ▾"}
.proof{margin:0 0 16px 40px;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:14.5px;overflow-wrap:anywhere}
.proof cite{display:block;font-style:normal;font-size:12.5px;margin-top:8px;color:var(--muted)}
.rows{margin-top:22px;border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 2px;border-bottom:1px solid var(--line);align-items:center}
.r .k{font-weight:500}
.r .h{font-size:14px;color:var(--muted);margin-top:2px}
.yes{color:var(--up);font-weight:600;font-size:14px}
.no{color:var(--faint);font-size:14px}
.callout{background:var(--soft);border-radius:var(--r);padding:24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.callout h3{font-size:19px}
.callout p{margin:4px 0 0;color:var(--muted);font-size:14.5px;max-width:52ch}
.hist{margin-top:22px;background:var(--soft);border-radius:var(--r);padding:22px}
.hist svg{width:100%;height:120px;display:block}
.hist .hrow{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.hist .hrow div{font-size:13px;color:var(--muted)}
.hist .hrow b{display:block;font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.src{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--line)}
.src li{padding:14px 2px;border-bottom:1px solid var(--line);font-size:14.5px;overflow-wrap:anywhere}
.inline-form{margin-top:16px;padding:22px;background:var(--soft);border-radius:var(--r)}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:22px}
.story{display:block;color:var(--ink);background:var(--soft);border-radius:var(--r);padding:20px}
.story:hover{text-decoration:none;background:var(--accent-soft)}
.story .who{font-size:12.5px;color:var(--muted)}
.story b{display:block;font-size:17px;letter-spacing:-.015em;margin-top:8px}
.story p{margin:8px 0 0;font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story .out{margin-top:12px;font-size:14px;font-weight:600;color:var(--up)}
.sbody{margin-top:36px;max-width:680px}
.sbody h2{margin-top:36px;font-size:17px}
.sbody p{white-space:pre-wrap;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:28px}
.facts div{background:var(--soft);border-radius:14px;padding:14px 16px}
.facts .k{font-size:12.5px;color:var(--muted)}
.facts .v{font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.reply{margin-top:16px;padding:16px 18px;border-left:3px solid var(--line)}
.reply .who{font-size:12.5px;color:var(--muted)}
.reply p{margin:6px 0 0}

/* reviews */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:22px}
.qstat{background:var(--soft);border-radius:14px;padding:16px}
.qstat .k{font-size:13px;color:var(--muted)}
.qstat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.qstat .bar{margin-top:8px}
.review{padding:18px 2px;border-bottom:1px solid var(--line)}
.review .who{font-size:13px;color:var(--muted)}
.review .yn{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.y{background:var(--up-soft);color:var(--up)}
.pill.n{background:var(--soft);color:var(--muted)}
.review p{margin:10px 0 0;font-size:15px;overflow-wrap:anywhere}
.ynq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ynq .opts{display:flex;gap:6px}
.ynq input{position:absolute;opacity:0;pointer-events:none}
.ynq label{font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;background:var(--bg)}
.ynq input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ynq input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
#rf{margin-top:20px;padding:22px;background:var(--soft);border-radius:var(--r)}
form{display:flex;flex-direction:column;gap:14px}
form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
form label.check{flex-direction:row;align-items:center;gap:10px;font-weight:400}
form label.check input{width:18px;height:18px;margin:0}
form input,form select,form textarea{font:inherit;font-size:15px;font-weight:400;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ok{font-size:14px;color:var(--up);background:var(--up-soft);padding:12px 14px;border-radius:10px}
.msg{font-size:14px;color:var(--muted)}
.hint{font-size:13px;font-weight:400;color:var(--muted)}

/* compare */
.cmpwrap{overflow-x:auto;margin-top:30px}
.cmpt{width:100%;border-collapse:collapse;min-width:620px}
.cmpt th,.cmpt td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:15px}
.cmpt thead th{vertical-align:bottom;border-bottom:0;padding-bottom:20px}
.cmpt tbody th{font-weight:400;width:36%}
.cmpt .g th{font-size:13px;font-weight:600;color:var(--muted);padding-top:30px}
.cmpt .bestc{color:var(--up)}

/* generic pages */
.page{padding-top:64px;max-width:680px}
.page h2{margin-top:44px}
.page li{margin:6px 0}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.rubric div{background:var(--soft);border-radius:14px;padding:16px}
.rubric ol{margin:8px 0 0;padding-left:18px;font-size:14.5px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:30px;align-items:start}
.card{background:var(--soft);border-radius:var(--r);padding:22px}
.phero{padding:36px 0 8px;max-width:640px}
.phero h1{margin-top:10px}
.phero p{font-size:19px;color:var(--muted);margin:14px 0 0;line-height:1.45}
.phero .acts{margin-top:26px}
.pmail{margin-top:12px;font-size:14px;color:var(--muted)}
.pstats{margin-top:40px}
.pstats .v{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.pstats .k{font-size:13px;color:var(--muted);margin-top:8px}
.psteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.psteps>div{background:var(--soft);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
.psteps .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600}
.psteps b{font-size:16px;margin-top:4px}
.psteps span:last-child{font-size:14px;color:var(--muted)}
.pchecks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.pchecks>div{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:14px 16px;font-weight:500}
.pagents{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:22px}
.pagents>div{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.pagents b{display:block;font-size:15px}
.pagents span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pcta{margin-top:72px;text-align:center;padding:40px 20px;background:var(--soft);border-radius:var(--r)}
.pcta .acts{margin-top:20px}
@media (max-width:700px){ .psteps{grid-template-columns:repeat(2,minmax(0,1fr))} .pchecks{grid-template-columns:1fr} }
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.pcard{display:block;color:var(--ink)}
.pcard:hover{text-decoration:none;background:var(--accent-soft)}
.pcard b{display:block;font-size:17px}
.pcard span{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}
details.plain{margin-top:12px}
details.plain summary{cursor:pointer;color:var(--accent);font-size:14.5px}
.rejtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}
.rejtable td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.rejtable td:first-child{white-space:nowrap;color:var(--muted)}

footer{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#index"><i aria-hidden="true"></i><span>Valued Agent Reseller</span></a>
  <nav class="main" aria-label="Main">
    <a href="#index" data-nav="index">Jobs</a>
    <a href="#stories" data-nav="stories">Stories</a>
    <a href="#list" data-nav="list">This week</a>
    <a href="#method" data-nav="method">How it works</a>
    <a href="#claim" data-nav="claim">For providers</a>
    <a href="#pulse" data-nav="pulse">Pulse</a>
  </nav>
</div></header>

<main class="wrap" id="app" aria-live="polite"><p class="empty">Loading…</p></main>

<div class="tray" id="tray" role="region" aria-label="Compare">
  <span id="trayTxt"></span><button class="x" type="button" id="trayClear">Clear</button><a class="btn sm" href="#compare">Compare</a>
</div>

<footer><div class="wrap">
  <span id="footStamp" class="tnum"></span>
  <span>Operated by <a href="https://brine.ai" target="_blank" rel="noopener">Brine AI</a> · <a href="#method">How it works</a></span>
</div></footer>

<script>
const S = {agents:[], run:null, hist:null, jobs:null, stories:[], jobStats:null, corrections:null, rejects:null,
  period:'now', industry:'All', q:'', sort:'rank', must:[], cmp:[], pick:null, pickJob:null, fopen:false, first:true, hq:''};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORDER = ['pricing','free','docs','customer','result','updated','no_training','security_page','certification','your_env','audit_logs','human_approval'];
const SHORT = {pricing:'Public pricing', free:'Free tier', docs:'Public docs', customer:'Named customer', result:'Measured result', updated:'Updated in 30 days', no_training:"Won't train on your data", security_page:'Security page', certification:'SOC 2 / ISO 27001', your_env:'Runs in your environment', audit_logs:'Audit logs', human_approval:'Human approval step'};
const host = u => { try { return new URL(u).host.replace(/^www\./,''); } catch { return u; } };
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- jobs map ---------- */
const JOBS = () => (S.jobs && S.jobs.jobs) || [];
const jobById = id => JOBS().find(j => j.id === id);
const jobRx = j => { try { return new RegExp('\\b(?:' + j.match + ')\\b', 'i'); } catch { return /$^/; } };
const matchJobs = text => JOBS().filter(j => jobRx(j).test(text || '')).map(j => j.id);
const agentsFor = jid => S.agents.filter(a => (a.jobs || []).includes(jid)).sort((x,y) => x.rank - y.rank);
const storiesFor = jid => S.stories.filter(s => s.job === jid);
const storiesAbout = aid => S.stories.filter(s => s.agent === aid);
const provsFor = jid => (S.providers || []).filter(p => (p.jobs || []).includes(jid));
const jobLink = jid => { const j = jobById(jid); return j ? `<a class="jobtag" href="#job-${esc(j.id)}">${esc(j.name)}</a>` : ''; };

/* ---------- archive (real runs only) ---------- */
const PERIODS = [['now','This week',0],['1w','Last week',7],['1m','1 month ago',30],['6m','6 months ago',182],['1y','1 year ago',365]];
const D = s => new Date(s + 'T12:00:00Z');
const iso = d => d.toISOString().slice(0,10);
const nice = s => D(s).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC',year: D(s).getUTCFullYear() !== D(S.hist.latest).getUTCFullYear() ? 'numeric' : undefined});
function dayAt(back){
  if (!back) return S.hist.latest;
  const target = iso(new Date(+D(S.hist.latest) - back*864e5));
  const ds = Object.keys(S.hist.days).filter(d => d <= target).sort();
  return ds.length ? ds[ds.length-1] : null;
}
const availableFrom = back => nice(iso(new Date(+D(S.hist.first) + back*864e5)));
function movement(id, curRank){
  const prevDay = dayAt(7);
  if (!prevDay || prevDay === S.hist.latest) return null;
  const prev = S.hist.days[prevDay].find(r => r.id === id);
  if (!prev) return {cls:'new', txt:'New'};
  const d = prev.rank - curRank;
  return d > 0 ? {cls:'up', txt:`▲ ${d}`} : d < 0 ? {cls:'down', txt:`▼ ${-d}`} : {cls:'same', txt:'—'};
}

/* ---------- home: the job box and the job map ---------- */
function tile(j, hit){
  const n = agentsFor(j.id).length, m = storiesFor(j.id).length, p = provsFor(j.id).length;
  const bits = [n ? plural(n, 'agent') : null, m ? plural(m, 'story') : null, p ? plural(p, 'provider') : null].filter(Boolean);
  return `<a class="tile ${bits.length ? '' : 'dim'} ${hit ? 'hit' : ''}" href="#job-${esc(j.id)}"><b>${esc(j.name)}</b><span>${bits.length ? esc(bits.join(' · ')) : 'Nobody listed yet'}</span></a>`;
}
function jobMap(q, hits){
  const fns = (S.jobs && S.jobs.functions) || [];
  const ql = (q || '').trim().toLowerCase();
  return fns.map(fn => {
    let list = JOBS().filter(j => j.function === fn);
    if (ql) list = list.filter(j => hits.includes(j.id) || j.name.toLowerCase().includes(ql) || fn.toLowerCase().includes(ql));
    if (!list.length) return '';
    return `<section class="fn"><h2>${esc(fn)}</h2><div class="tiles">${list.map(j => tile(j, hits.includes(j.id))).join('')}</div></section>`;
  }).join('') || `<div class="empty"><h3>No job on the map matches</h3>Press “Find an agent” and we’ll record it. That is how new jobs get added.</div>`;
}
function viewHome(){
  const top = [...S.agents].sort((x,y) => x.rank - y.rank).slice(0,5);
  const named = S.jobStats && S.jobStats.count ? `${S.jobStats.count.toLocaleString()} jobs named so far.` : '';
  $('#app').innerHTML = `
    <section class="hero">
      <h1>What job do you want off your plate?</h1>
      <form class="jobbox" id="jb" novalidate><input id="jq" type="search" placeholder="Chasing overdue invoices" aria-label="The job" value="${esc(S.hq)}" autocomplete="off"><label style="position:absolute;left:-9999px" aria-hidden="true">Website<input id="hp_url" tabindex="-1" autocomplete="off"></label><button class="btn" type="submit">Find an agent</button></form>
      <div class="jobnote" id="jnote">${esc(named)}</div>
      <div class="notify" id="notify" hidden><input id="jmail" type="email" placeholder="you@company.com" aria-label="Email"><button class="btn sec sm" type="button" id="jtell">Tell me when one exists</button></div>
    </section>
    <div id="map">${jobMap(S.hq, S.hq ? matchJobs(S.hq) : [])}</div>
    <section class="weekstrip"><div class="head"><h2>Most discussed this week</h2><a href="#list">All ${S.agents.length} ›</a></div>
      <div class="list" style="margin-top:16px">${top.map(a => row(a, movement(a.id, a.rank))).join('')}</div></section>`;
  const jq = $('#jq'), note = $('#jnote'), map = $('#map');
  let t;
  jq.oninput = () => { S.hq = jq.value; clearTimeout(t); t = setTimeout(() => { map.innerHTML = jobMap(S.hq, S.hq ? matchJobs(S.hq) : []); }, 120); };
  $('#jb').onsubmit = async e => {
    e.preventDefault();
    const job = jq.value.trim();
    if (job.length < 4) { note.className = 'jobnote'; note.textContent = 'Say the job in a few words.'; jq.focus(); return; }
    const hits = matchJobs(job);
    map.innerHTML = jobMap(job, hits);
    S.lastJob = job;
    note.className = 'jobnote'; note.textContent = 'Noted.';
    try { await fetch('/api/jobs', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ job, hp_url: $('#hp_url').value }) }); } catch {}
    if (hits.length && hits.some(h => agentsFor(h).length)) { note.className = 'jobnote ok'; note.textContent = `${plural(hits.reduce((n,h) => n + agentsFor(h).length, 0), 'agent')} below do this.`; $('#notify').hidden = true; const first = map.querySelector('.tile.hit'); if (first) first.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'center'}); }
    else { note.textContent = 'No agent on the list does this yet.'; $('#notify').hidden = false; }
  };
  $('#jtell').onclick = async () => {
    const email = $('#jmail').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { note.className = 'jobnote'; note.textContent = 'Enter a valid email address.'; return; }
    try {
      const res = await fetch('/api/jobs', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ job: S.lastJob || jq.value.trim(), email, notify: true }) });
      if (res.ok) { note.className = 'jobnote ok'; note.textContent = "We'll email you when an agent for this is listed. Nothing else."; $('#notify').hidden = true; }
      else note.textContent = "That didn't send. Try again.";
    } catch { note.textContent = "That didn't send. Try again."; }
  };
}

/* ---------- job page ---------- */
function viewJob(id){
  const j = jobById(id);
  if (!j) { $('#app').innerHTML = `<a class="back" href="#index">‹ Jobs</a><div class="empty"><h3>No job here by that name</h3></div>`; return; }
  const agents = agentsFor(id), stories = storiesFor(id), provs = provsFor(id);
  $('#app').innerHTML = `<a class="back" href="#index">‹ Jobs</a>
    <section class="phero">
      <div class="eyebrow">${esc(j.function)}</div>
      <h1>${esc(j.name)}</h1>
      <div class="acts"><a class="btn" href="#manage" id="jhelp">Get help with this job</a><a class="btn sec" href="#share" id="jshare">Share your story</a></div>
    </section>
    <section class="sec-block" style="margin-top:48px"><h2>Agents that do it</h2>
      ${agents.length ? `<div class="list" style="margin-top:18px">${agents.map(a => row(a, movement(a.id, a.rank))).join('')}</div>` : `<div class="empty"><h3>No agent on this week's list names this job</h3>Agents join by being talked about. Know one? <a href="#claim">List it ›</a></div>`}
    </section>
    <section class="sec-block"><h2>Stories</h2>
      ${stories.length ? `<div class="stories">${stories.map(storyCard).join('')}</div>` : `<p class="lead">No story for this job yet. If you've automated it, <a href="#share">tell people how ›</a></p>`}
    </section>
    ${provs.length ? `<section class="sec-block"><h2>Providers who do this job</h2><div class="pgrid">${provs.map(p => `<a class="card pcard" href="#provider-${esc(p.slug)}"><b>${esc(p.name)}</b><span>${(p.kinds||[]).map(k => esc(KIND[k]||k)).join(' · ')}</span></a>`).join('')}</div></section>` : ''}`;
  $('#jhelp').onclick = () => { S.pickJob = id; S.pick = null; };
  $('#jshare').onclick = () => { S.pickJob = id; S.pick = null; };
  window.scrollTo(0,0);
}

/* ---------- list page (most discussed, with archive) ---------- */
function currentRows(){
  if (S.period === 'now') return S.agents.map(a => ({...a, _mv: movement(a.id, a.rank)}));
  const day = dayAt(PERIODS.find(p => p[0] === S.period)[2]);
  return (S.hist.days[day] || []).map(r => {
    const now = S.agents.find(a => a.id === r.id);
    return {...(now || {}), ...r, description: now ? now.description : 'No longer on the list', checks: now ? now.checks : null,
      _mv: now ? {cls:'same', txt:`Now #${now.rank}`} : {cls:'same', txt:'Dropped off'}, _gone: !now};
  });
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let list = currentRows().filter(a =>
    (S.industry === 'All' || a.industry === S.industry) &&
    (!S.must.length || (a.checks && S.must.every(k => a.checks[k].answer))) &&
    (!q || [a.name, a.owner, a.description, a.industry, ...(a.jobs||[]).map(id => (jobById(id)||{}).name)].join(' ').toLowerCase().includes(q)));
  if (S.sort === 'momentum') list.sort((x,y) => (y.star_gain_7d||0) - (x.star_gain_7d||0) || x.rank - y.rank);
  else if (S.sort === 'reviews') list.sort((x,y) => ((S.reviews[y.id]||[]).length - (S.reviews[x.id]||[]).length) || x.rank - y.rank);
  else list.sort((x,y) => x.rank - y.rank);
  return list;
}
function row(a, mv, i){
  const us = userScore(a.id);
  return `<a class="item ${a.rank<=3?'top3':''} ${S.first && i != null ?'enter':''}" role="listitem" data-id="${esc(a.id)}" href="${a._gone?'#list':'#agent-'+esc(a.id)}" style="${S.first && i != null ?`animation-delay:${Math.min(i,12)*35}ms`:''}">
      <div class="rk"><b>${a.rank}</b>${mv ? `<span class="mv ${mv.cls}">${esc(mv.txt)}</span>` : ''}</div>
      <div class="nm"><b>${esc(a.name)}</b><span>${esc(a.description)}</span></div>
      <div class="sc"><span class="v">${a.score} <small>of 12</small></span><div class="bar"><i style="width:${a.score/12*100}%"></i></div>${us ? `<span class="us tnum">${us.pct}% · ${plural(us.n, 'review')}</span>` : ''}</div>
      <span class="chev" aria-hidden="true">›</span>
    </a>`;
}
function viewList(){
  const cnt = i => S.agents.filter(x => x.industry === i).length;
  const inds = ['All', ...[...new Set(S.agents.map(a => a.industry))].sort((a,b) => cnt(b) - cnt(a))];
  const nf = S.must.length + (S.sort !== 'rank');
  $('#app').innerHTML = `
    <section class="hero" style="padding-bottom:20px">
      <h1>Most discussed this week</h1>
      <div class="periods" role="group" aria-label="Time period">${PERIODS.map(([k,l,b]) => { const ok = !b || (dayAt(b) && dayAt(b) !== S.hist.latest); return `<button type="button" data-p="${k}" aria-pressed="${S.period===k}" ${ok?'':'disabled'} title="${ok?'':'Available from '+esc(availableFrom(b))}">${l}</button>`; }).join('')}</div>
      <div class="periodnote" id="pnote"></div>
    </section>
    <div class="controls">
      <div class="inds" role="group" aria-label="Industry">${inds.map(i => `<button class="chip" type="button" data-ind="${esc(i)}" aria-pressed="${S.industry===i}">${esc(i)}</button>`).join('')}</div>
      <input class="search" id="q" type="search" placeholder="Search" value="${esc(S.q)}" aria-label="Search agents">
      <button class="fbtn ${nf?'has':''}" type="button" id="fbtn" aria-expanded="${S.fopen}" aria-controls="fpanel">Filters${nf?` · ${nf}`:''}</button>
    </div>
    <div class="fpanel" id="fpanel" ${S.fopen?'':'hidden'}>
      <div class="row"><span class="lbl">Must pass</span>${ORDER.map(k => `<button class="opt" type="button" data-must="${k}" aria-pressed="${S.must.includes(k)}">${esc(SHORT[k])}</button>`).join('')}</div>
      <div class="row"><span class="lbl">Sort</span>${[['rank','Rank'],['momentum','Momentum'],['reviews','Most reviewed']].map(([v,l]) => `<button class="opt" type="button" data-sort="${v}" aria-pressed="${S.sort===v}">${l}</button>`).join('')}</div>
    </div>
    <div class="count"><button class="linkbtn" id="reset" type="button" ${nf||S.industry!=='All'||S.q?'':'hidden'}>Clear all</button></div>
    <div class="list" id="rows" role="list"></div>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (b.disabled) return; S.period = b.dataset.p; document.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows(true); });
  document.querySelectorAll('[data-ind]').forEach(b => b.onclick = () => { S.industry = b.dataset.ind; document.querySelectorAll('[data-ind]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows(true); syncReset(); });
  $('#q').oninput = e => { S.q = e.target.value; renderRows(true); syncReset(); };
  $('#fbtn').onclick = () => { S.fopen = !S.fopen; $('#fpanel').hidden = !S.fopen; $('#fbtn').setAttribute('aria-expanded', S.fopen); };
  const setOpt = (attr, key, multi) => document.querySelectorAll(`[${attr}]`).forEach(b => b.onclick = () => {
    const v = b.getAttribute(attr);
    if (multi) { S.must = S.must.includes(v) ? S.must.filter(x => x !== v) : [...S.must, v]; b.setAttribute('aria-pressed', S.must.includes(v)); }
    else { S[key] = v; document.querySelectorAll(`[${attr}]`).forEach(x => x.setAttribute('aria-pressed', x === b)); }
    renderRows(true); syncReset();
  });
  setOpt('data-must', 'must', true); setOpt('data-sort', 'sort');
  $('#reset').onclick = () => { Object.assign(S, {industry:'All', must:[], q:'', sort:'rank'}); viewList(); };
  renderRows(false);
}
function syncReset(){
  const nf = S.must.length + (S.sort !== 'rank');
  $('#fbtn').textContent = 'Filters' + (nf ? ` · ${nf}` : ''); $('#fbtn').classList.toggle('has', !!nf);
  $('#reset').hidden = !(nf || S.industry !== 'All' || S.q);
}
function renderRows(animate){
  const box = $('#rows'); if (!box) return;
  const before = {};
  if (animate && !reduced()) box.querySelectorAll('.item').forEach(el => before[el.dataset.id] = el.getBoundingClientRect().top);
  const list = filtered();
  const back = PERIODS.find(p => p[0] === S.period)[2];
  const pn = $('#pnote');
  if (pn) {
    const wk = dayAt(7);
    pn.textContent = S.period === 'now'
      ? (wk && wk !== S.hist.latest ? `Arrows show movement since ${nice(wk)}.` : '')
      : `The list as it stood on ${nice(dayAt(back))}.`;
  }
  box.innerHTML = list.length ? list.map((a, i) => row(a, a._mv, i)).join('') : `<div class="empty"><h3>No agents match</h3>Try another industry or remove a filter.</div>`;
  S.first = false;
  if (animate && !reduced()) box.querySelectorAll('.item').forEach(el => {
    const was = before[el.dataset.id], now = el.getBoundingClientRect().top;
    if (was == null) { el.animate([{opacity:.3, transform:'translateY(10px)'},{opacity:1, transform:'none'}], {duration:380, easing:'cubic-bezier(.2,.7,.2,1)'}); return; }
    if (Math.abs(was - now) > 1) el.animate([{transform:`translateY(${was-now}px)`},{transform:'none'}], {duration:520, easing:'cubic-bezier(.2,.7,.2,1)'});
  });
}

/* ---------- compare ---------- */
function toggleCmp(id){
  if (S.cmp.includes(id)) S.cmp = S.cmp.filter(x => x !== id);
  else { if (S.cmp.length >= 3) S.cmp.shift(); S.cmp.push(id); }
  store.set('vaq-cmp', S.cmp); renderTray();
}
function renderTray(){
  const on = S.cmp.length > 0 && location.hash !== '#compare';
  $('#tray').classList.toggle('on', on);

function histBlock(a){
  const pts = Object.keys(S.hist.days).sort().map(d => ({d, r: (S.hist.days[d].find(x => x.id === a.id) || {}).rank})).filter(p => p.r);
  const at = d => d && d !== S.hist.latest ? ((S.hist.days[d].find(x => x.id === a.id) || {}).rank) : undefined;
  const cell = (label, d) => { const ok = d && d !== S.hist.latest, r = at(d); return `<div>${label}<b>${ok ? (r ? '#' + r : 'Not listed') : '—'}</b></div>`; };
  let chart;
  if (pts.length >= 2) {
    const W = 600, H = 120, max = Math.max(...pts.map(p => p.r), 10);
    const xy = pts.map((p,i) => [i/(pts.length-1)*(W-20)+10, (p.r-1)/(max-1)*(H-20)+10]);
    chart = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Rank over time"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${xy.map(p=>p.join(',')).join(' ')}"/></svg>`;
  } else chart = '';
  return `<div class="hist">${chart}<div class="hrow"><div>Now<b>#${a.rank}</b></div>${cell('Last week', dayAt(7))}${cell('1 month ago', dayAt(30))}<div>Runs on the list<b>${pts.length}</b></div></div></div>`;
}
function userScore(id){
  const l = (S.reviews||{})[id] || [];
  if (!l.length) return null;
  let yes = 0, all = 0;
  l.forEach(r => QS.forEach(([k]) => { if (r[k]) { all++; if (r[k] === 'yes') yes++; } }));
  return { pct: all ? Math.round(100 * yes / all) : 0, n: l.length };
}
function revTxt(id){
  const u = userScore(id);
  return u ? `${u.pct}% positive · ${plural(u.n, 'review')}` : 'No reviews yet';
}
function userBig(id){
  const u = userScore(id);
  return u ? `<b>${u.pct}%</b><span>user score · ${plural(u.n, 'review')}</span>` : `<a href="#reviews" class="rvlink">No reviews yet</a>`;
}
function reportForm(agentId, storyId, kind){

function bindReport(agentId, storyId, kind, opener){
  const box = $('#rpt'), f = $('#rptf'); if (!box || !f) return;
  const open = $(opener); if (open) open.onclick = () => { box.hidden = false; (f.querySelector('#rp-name') || f.querySelector('#rp-what')).focus(); };
  $('#rp-cancel').onclick = () => { box.hidden = true; };
  f.onsubmit = async e => {
    e.preventDefault();
    const msg = $('#rp-msg'); msg.hidden = false; msg.className = 'msg';
    const payload = { kind, agent: agentId || '', story: storyId || '', what: $('#rp-what').value.trim(), email: $('#rp-mail').value.trim(), name: ($('#rp-name') || {value:''}).value.trim(), hp_url: $('#rp-hp').value };
    if (payload.what.length < 5) { msg.textContent = kind === 'reply' ? 'Write the reply.' : 'Say what is wrong.'; return; }
    if (kind === 'reply' && !payload.name) { msg.textContent = 'Say who is replying.'; return; }
    msg.textContent = 'Sending…';
    try {
      const res = await fetch('/api/report', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { msg.textContent = out.error && out.error !== 'unavailable' ? out.error : "That didn't send. Try again."; return; }
      msg.className = 'ok'; msg.textContent = kind === 'reply' ? 'Sent. A person reads it and posts it under the story.' : 'Sent. A person checks every report, and fixes are listed on the How it works page.';
      f.querySelectorAll('input,textarea').forEach(i => i.value = '');
    } catch { msg.textContent = "That didn't send. Try again."; }
  };
}

async function initLive(){
  S.uid = getUid();
  const get = async (url, fallback) => { try { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw 0; return await r.json(); } catch { return fallback; } };
  const [rv, st, js, co, rj] = await Promise.all([get('/api/reviews', null), get('/api/stories', null), get('/api/jobs', null), get('/api/corrections', null), get('rejects.json', null)]);
  S.reviews = {};
  if (rv) { Object.entries(rv.byAgent || {}).forEach(([aid, l]) => { if (S.agents.some(x => x.id === aid)) S.reviews[aid] = l; }); S.dbState = 'ok'; } else S.dbState = 'off';
  S.stories = (st && st.stories) || [];
  S.jobStats = js;
  S.corrections = co ? co.corrections : [];
  S.rejects = rj;
  refreshLive();
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1) || 'index';
  const section = h.startsWith('agent-') || h === 'compare' || h === 'list' ? 'list' : h === 'manage' || h.startsWith('provider-') ? 'claim' : h.startsWith('story-') || h === 'share' ? 'stories' : h.startsWith('job-') ? 'index' : h;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === section) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (h.startsWith('agent-')) viewAgent(h.slice(6));
  else if (h.startsWith('job-')) viewJob(h.slice(4));
  else if (h.startsWith('story-')) viewStory(h.slice(6));
  else if (h.startsWith('provider-')) viewProvider(h.slice(9));
  else if (h === 'list') viewList();
  else if (h === 'stories') viewStories();
  else if (h === 'share') viewShare();
  else if (h === 'compare') viewCompare();
  else if (h === 'method') viewMethod();
  else if (h === 'claim') viewClaim();
  else if (h === 'manage') viewManage();
  else if (h === 'pulse') viewPulse();
  else viewHome();
  renderTray();
  if (!h.startsWith('agent-') && !h.startsWith('provider-') && !h.startsWith('job-') && !h.startsWith('story-')) window.scrollTo(0,0);
}
Promise.all(['agents.json','run.json','history.json','jobs.json'].map(f => fetch(f).then(r => r.json())).concat([fetch('providers.json').then(r => r.ok ? r.json() : []).catch(() => [])]))
  .then(([agents, run, hist, jobs, providers]) => {
    S.agents = agents; S.run = run; S.hist = hist; S.jobs = jobs; S.providers = Array.isArray(providers) ? providers : [];
    S.cmp = (store.get('vaq-cmp') || []).filter(id => agents.some(a => a.id === id)).slice(0,3);
    $('#footStamp').textContent = `Published ${nice(hist.latest)}`;
    $('#trayClear').onclick = () => { S.cmp = []; store.set('vaq-cmp', []); renderTray(); };
    route(); addEventListener('hashchange', route);
    initLive();
  })
  .catch(() => { $('#app').innerHTML = '<div class="empty"><h3>The site didn\'t load</h3>Refresh the page to try again.</div>'; });
</script>
</body>
</html>
