<head>

<meta property="og:site_name" content="Valued Agent Reseller">
<meta property="og:title" content="Valued Agent Reseller: today's AI agent rankings">
<meta property="og:description" content="Fifty trending AI agents, scored on twelve yes/no checks with a public source for every Yes.">
<meta property="og:url" content="https://valuedagentreseller.com/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A1C20'/%3E%3Crect x='10' y='10' width='12' height='12' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">

<style>
/* Layout: calm, one column, generous whitespace. One list that moves over time
   (this week vs. past weeks), each agent opening into a quiet spec page. */
:root{
  --bg:#FFFFFF; --soft:#F5F6F8; --ink:#1A1C20; --muted:#6B7079; --faint:#A1A6AE; --line:#E6E8EC;
  --accent:#0A62D0; --accent-soft:#EAF2FD; --on-accent:#FFFFFF;
  --up:#1E9E5A; --up-soft:#E5F5EC; --down:#C2410C; --down-soft:#FDEEE6; --new:#0A62D0;
  --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E; --soft:#17191D; --ink:#F2F3F5; --muted:#9BA1AB; --faint:#5F6570; --line:#25282E;
  --accent:#5AA2FF; --accent-soft:#13243B; --on-accent:#0B0C0E;
  --up:#4ACF85; --up-soft:#12291C; --down:#FF8A4C; --down-soft:#2E1A10; --new:#5AA2FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0C0E; --soft:#17191D; --ink:#F2F3F5; --muted:#9BA1AB; --faint:#5F6570; --line:#25282E;
  --accent:#5AA2FF; --accent-soft:#13243B; --on-accent:#0B0C0E;
  --up:#4ACF85; --up-soft:#12291C; --down:#FF8A4C; --down-soft:#2E1A10; --new:#5AA2FF;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.025em;font-weight:700}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15}
h3{font-size:17px;letter-spacing:-.01em}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:52px}
.mark{font-weight:700;letter-spacing:-.02em;color:var(--ink);font-size:16px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.mark:hover{text-decoration:none}
.mark i{width:14px;height:14px;border-radius:4px;background:var(--ink);display:inline-block;position:relative}
.mark i::after{content:"";position:absolute;inset:4px;border-radius:1.5px;background:var(--bg)}
nav.main{margin-left:auto;display:flex;gap:22px}
nav.main a{font-size:13.5px;color:var(--muted)}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink);text-decoration:none}
@media (max-width:600px){ nav.main{gap:14px} nav.main a[data-nav="pulse"]{display:none} .mark span{display:none} }

main{padding-block:0 140px;min-height:70vh}

/* hero */
.hero{text-align:center;padding:72px 0 40px}
.hero h1{max-width:19ch;margin:14px auto 0}
.hero p{max-width:46ch;margin:18px auto 0;font-size:19px;color:var(--muted);line-height:1.45}
.periods{display:inline-flex;gap:2px;padding:3px;background:var(--soft);border-radius:999px;margin-top:34px;max-width:100%;overflow-x:auto}
.periods button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.periods button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.periods button:disabled{cursor:default;opacity:.45}
.periodnote{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}

/* controls */
.controls{display:flex;gap:10px;align-items:center;margin:20px 0 6px;flex-wrap:wrap}
.inds{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.inds::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--soft);padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;width:200px;max-width:100%}
.fbtn{border:0;background:var(--soft);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap}
.fbtn[aria-expanded="true"],.fbtn.has{background:var(--accent-soft);color:var(--accent)}
.fpanel{background:var(--soft);border-radius:var(--r);padding:20px;margin-top:10px;display:grid;gap:16px}
.fpanel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fpanel .lbl{font-size:13px;font-weight:600;color:var(--muted);width:90px;flex:none}
.opt{border:1px solid var(--line);background:var(--bg);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.count{font-size:13px;color:var(--muted);margin:18px 0 4px;display:flex;justify-content:flex-end;gap:10px;min-height:18px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px}
@media (max-width:640px){ .search{flex:1;width:auto} }

/* list */
.list{position:relative}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) 150px 18px;gap:18px;align-items:center;padding:20px 4px;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);text-decoration:none}
.item:hover{text-decoration:none}
.item:hover .nm b{color:var(--accent)}
.item:last-child{border-bottom:1px solid var(--line)}
.rk{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rk b{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.item.top3 .rk b{font-size:34px}
.mv{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.mv.up{color:var(--up);background:var(--up-soft)}
.mv.down{color:var(--down);background:var(--down-soft)}
.mv.same{color:var(--faint)}
.mv.new{color:var(--new);background:var(--accent-soft)}
.nm{min-width:0}
.nm b{font-size:18px;font-weight:600;letter-spacing:-.015em;transition:color .15s}
.nm span{display:block;color:var(--muted);font-size:14.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.sc .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sc .v small{color:var(--muted);font-weight:400}
.sc .us{font-size:12px;color:var(--muted);white-space:nowrap}
.bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--up);transform-origin:left;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(.35)}to{transform:none}}
.chev{color:var(--faint);font-size:20px}
.empty{padding:64px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
@media (max-width:640px){
  .item{grid-template-columns:48px minmax(0,1fr) 72px;gap:12px;padding:16px 0}
  .chev{display:none}
  .rk b{font-size:22px} .item.top3 .rk b{font-size:26px}
  .nm b{font-size:16px} .nm span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}

/* compare tray */
.tray{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:25;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.7,.2,1);max-width:calc(100vw - 32px)}
.tray:not(.on){visibility:hidden;box-shadow:none}
.tray.on{transform:translate(-50%,0)}
.tray span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray .x{border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;font-size:13px}
.btn{border:0;background:var(--accent);color:var(--on-accent);padding:10px 20px;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{text-decoration:none;filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.sm{font-size:13.5px;padding:7px 14px}

/* agent page */
.back{display:inline-block;font-size:14px;margin:28px 0 0}
.ahead{padding:36px 0 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.ahead p{font-size:19px;color:var(--muted);max-width:52ch;margin:14px 0 0;line-height:1.45}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;align-items:center}
.acts a.txt{font-size:15px;margin-left:6px}
.big{text-align:right}
.big b{display:block;font-size:84px;font-weight:600;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.big span{font-size:14px;color:var(--muted)}
.big .ubig{margin-top:18px}
.big .ubig b{font-size:34px;letter-spacing:-.03em;line-height:1}
.big .ubig a{font-size:14px}
@media (max-width:700px){ .ahead{grid-template-columns:1fr} .big{text-align:left} .big b{font-size:64px} }
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:36px}
.strip>div{background:var(--soft);border-radius:14px;padding:14px 16px}
.strip .k{font-size:13px;color:var(--muted)}
.strip .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.strip .bar{margin-top:10px}
@media (max-width:700px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} }
.sec-block{margin-top:72px;scroll-margin-top:70px}
.sec-block>p.lead{color:var(--muted);margin:8px 0 0;max-width:60ch}
.tag-ns{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:999px;margin-left:10px;vertical-align:middle;letter-spacing:0}
.checks{margin-top:22px;border-top:1px solid var(--line)}
.ck{border-bottom:1px solid var(--line)}
.ck summary{list-style:none;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 2px;cursor:pointer}
.ck summary::-webkit-details-marker{display:none}
.ck summary.static{cursor:default}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.dot.y{background:var(--up);color:var(--bg)}
.dot.n{background:var(--soft);color:var(--faint)}
.ck .grp{font-size:12.5px;color:var(--faint)}
.ck .more{font-size:13px;color:var(--accent)}
.ck[open] .more::after{content:" ▴"} .ck:not([open]) .more::after{content:" ▾"}
.proof{margin:0 0 16px 40px;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:14.5px;overflow-wrap:anywhere}
.proof cite{display:block;font-style:normal;font-size:12.5px;margin-top:8px;color:var(--muted)}
.rows{margin-top:22px;border-top:1px solid var(--line)}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 2px;border-bottom:1px solid var(--line);align-items:center}
.r .k{font-weight:500}
.r .h{font-size:14px;color:var(--muted);margin-top:2px}
.yes{color:var(--up);font-weight:600;font-size:14px}
.no{color:var(--faint);font-size:14px}
.callout{background:var(--soft);border-radius:var(--r);padding:24px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px}
.callout h3{font-size:19px}
.callout p{margin:4px 0 0;color:var(--muted);font-size:14.5px;max-width:52ch}
.hist{margin-top:22px;background:var(--soft);border-radius:var(--r);padding:22px}
.hist svg{width:100%;height:120px;display:block}
.hist .hrow{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.hist .hrow div{font-size:13px;color:var(--muted)}
.hist .hrow b{display:block;font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.src{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--line)}
.src li{padding:14px 2px;border-bottom:1px solid var(--line);font-size:14.5px;overflow-wrap:anywhere}

/* reviews */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:22px}
.qstat{background:var(--soft);border-radius:14px;padding:16px}
.qstat .k{font-size:13px;color:var(--muted)}
.qstat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.qstat .bar{margin-top:8px}
.review{padding:18px 2px;border-bottom:1px solid var(--line)}
.review .who{font-size:13px;color:var(--muted)}
.review .yn{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.y{background:var(--up-soft);color:var(--up)}
.pill.n{background:var(--soft);color:var(--muted)}
.review p{margin:10px 0 0;font-size:15px;overflow-wrap:anywhere}
.ynq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ynq .opts{display:flex;gap:6px}
.ynq input{position:absolute;opacity:0;pointer-events:none}
.ynq label{font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;background:var(--bg)}
.ynq input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ynq input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
#rf{margin-top:20px;padding:22px;background:var(--soft);border-radius:var(--r)}
form{display:flex;flex-direction:column;gap:14px}
form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
form input,form select,form textarea{font:inherit;font-size:15px;font-weight:400;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;border-radius:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ok{font-size:14px;color:var(--up);background:var(--up-soft);padding:12px 14px;border-radius:10px}
.msg{font-size:14px;color:var(--muted)}

/* compare */
.cmpwrap{overflow-x:auto;margin-top:30px}
.cmpt{width:100%;border-collapse:collapse;min-width:620px}
.cmpt th,.cmpt td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:15px}
.cmpt thead th{vertical-align:bottom;border-bottom:0;padding-bottom:20px}
.cmpt tbody th{font-weight:400;width:36%}
.cmpt .g th{font-size:13px;font-weight:600;color:var(--muted);padding-top:30px}
.cmpt .bestc{color:var(--up)}

/* generic pages */
.page{padding-top:64px;max-width:680px}
.page h2{margin-top:44px}
.page li{margin:6px 0}
.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.rubric div{background:var(--soft);border-radius:14px;padding:16px}
.rubric ol{margin:8px 0 0;padding-left:18px;font-size:14.5px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:30px;align-items:start}
.card{background:var(--soft);border-radius:var(--r);padding:22px}
.psec ol,.psec ul{margin:18px 0 0;padding-left:22px;max-width:64ch}
.psec li{margin:8px 0}
.psec ol li::marker{font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.pcard{display:block;color:var(--ink)}
.pcard:hover{text-decoration:none;background:var(--accent-soft)}
.pcard b{display:block;font-size:17px}
.pcard span{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}

footer{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="mark" href="#index"><i aria-hidden="true"></i><span>Valued Agent Reseller</span></a>
  <nav class="main" aria-label="Main">
    <a href="#index" data-nav="index">Rankings</a>
    <a href="#method" data-nav="method">How we score</a>
    <a href="#claim" data-nav="claim">For providers</a>
    <a href="#pulse" data-nav="pulse">Pulse</a>
  </nav>
</div></header>

<main class="wrap" id="app" aria-live="polite"><p class="empty">Loading…</p></main>

<div class="tray" id="tray" role="region" aria-label="Compare">
  <span id="trayTxt"></span><button class="x" type="button" id="trayClear">Clear</button><a class="btn sm" href="#compare">Compare</a>
</div>

<footer><div class="wrap">
  <span id="footStamp" class="tnum"></span>
  <span>Valued Agent Reseller</span>
</div></footer>

<script>
const S = {agents:[], run:null, hist:null, period:'now', industry:'All', type:'All', q:'', sort:'rank', must:[], cmp:[], pick:null, fopen:false, first:true};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ORDER = ['pricing','free','docs','customer','result','updated','no_training','security_page','certification','your_env','audit_logs','human_approval'];
const SHORT = {pricing:'Public pricing', free:'Free tier', docs:'Public docs', customer:'Named customer', result:'Measured result', updated:'Updated in 30 days', no_training:"Won't train on your data", security_page:'Security page', certification:'SOC 2 / ISO 27001', your_env:'Runs in your environment', audit_logs:'Audit logs', human_approval:'Human approval step'};
const INDUSTRY_FALLBACK = ['Security','Healthcare','Finance','Legal','Education','HR & recruiting','E-commerce','Real estate','Manufacturing & logistics','Sales & marketing','Customer support','Software engineering','Research & data','Browser & computer use','Operations & IT','General purpose'];
const allIndustries = () => [...new Set([...(S.run.industries || INDUSTRY_FALLBACK), ...S.agents.map(a => a.industry)])].sort();
const host = u => { try { return new URL(u).host.replace(/^www\./,''); } catch { return u; } };
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- archive (real runs only) ---------- */
const PERIODS = [['now','This week',0],['1w','Last week',7],['1m','1 month ago',30],['6m','6 months ago',182],['1y','1 year ago',365]];
const D = s => new Date(s + 'T12:00:00Z');
const iso = d => d.toISOString().slice(0,10);
const nice = s => D(s).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC',year: D(s).getUTCFullYear() !== D(S.hist.latest).getUTCFullYear() ? 'numeric' : undefined});
function dayAt(back){
  if (!back) return S.hist.latest;
  const target = iso(new Date(+D(S.hist.latest) - back*864e5));
  const ds = Object.keys(S.hist.days).filter(d => d <= target).sort();
  return ds.length ? ds[ds.length-1] : null;
}
const availableFrom = back => nice(iso(new Date(+D(S.hist.first) + back*864e5)));
function movement(id, curRank){
  const prevDay = dayAt(7);
  if (!prevDay || prevDay === S.hist.latest) return null;
  const prev = S.hist.days[prevDay].find(r => r.id === id);
  if (!prev) return {cls:'new', txt:'New'};
  const d = prev.rank - curRank;
  return d > 0 ? {cls:'up', txt:`▲ ${d}`} : d < 0 ? {cls:'down', txt:`▼ ${-d}`} : {cls:'same', txt:'—'};
}

/* ---------- index ---------- */
function currentRows(){
  if (S.period === 'now') return S.agents.map(a => ({...a, _mv: movement(a.id, a.rank)}));
  const day = dayAt(PERIODS.find(p => p[0] === S.period)[2]);
  return (S.hist.days[day] || []).map(r => {
    const now = S.agents.find(a => a.id === r.id);
    return {...(now || {}), ...r, description: now ? now.description : 'No longer on the list', type: now ? now.type : '', checks: now ? now.checks : null,
      _mv: now ? {cls:'same', txt:`Now #${now.rank}`} : {cls:'same', txt:'Dropped off'}, _gone: !now};
  });
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let list = currentRows().filter(a =>
    (S.industry === 'All' || a.industry === S.industry) &&
    (S.type === 'All' || a.type === S.type) &&
    (!S.must.length || (a.checks && S.must.every(k => a.checks[k].answer))) &&
    (!q || [a.name, a.owner, a.description, a.industry].join(' ').toLowerCase().includes(q)));
  if (S.sort === 'momentum') list.sort((x,y) => (y.star_gain_7d||0) - (x.star_gain_7d||0) || x.rank - y.rank);
  else if (S.sort === 'reviews') list.sort((x,y) => ((S.reviews[y.id]||[]).length - (S.reviews[x.id]||[]).length) || x.rank - y.rank);
  else list.sort((x,y) => x.rank - y.rank);
  return list;
}

function viewIndex(){
  const cnt = i => S.agents.filter(x => x.industry === i).length;
  const inds = ['All', ...[...new Set(S.agents.map(a => a.industry))].sort((a,b) => cnt(b) - cnt(a))];
  const nf = S.must.length + (S.type !== 'All') + (S.sort !== 'rank');
  $('#app').innerHTML = `
    <section class="hero">
      <h1>Today's AI agent rankings</h1>
      <p>Agents everyone is talking about this week. We run and score each to help you make a confident decision on whether you'd want to use them.</p>
      <div class="periods" role="group" aria-label="Time period">${PERIODS.map(([k,l,b]) => { const ok = !b || (dayAt(b) && dayAt(b) !== S.hist.latest); return `<button type="button" data-p="${k}" aria-pressed="${S.period===k}" ${ok?'':'disabled'} title="${ok?'':'Available from '+esc(availableFrom(b))}">${l}</button>`; }).join('')}</div>
      <div class="periodnote" id="pnote"></div>
    </section>
    <div class="controls">
      <div class="inds" role="group" aria-label="Industry">${inds.map(i => `<button class="chip" type="button" data-ind="${esc(i)}" aria-pressed="${S.industry===i}">${esc(i)}</button>`).join('')}</div>
      <input class="search" id="q" type="search" placeholder="Search" value="${esc(S.q)}" aria-label="Search agents">
      <button class="fbtn ${nf?'has':''}" type="button" id="fbtn" aria-expanded="${S.fopen}" aria-controls="fpanel">Filters${nf?` · ${nf}`:''}</button>
    </div>
    <div class="fpanel" id="fpanel" ${S.fopen?'':'hidden'}>
      <div class="row"><span class="lbl">Must pass</span>${ORDER.map(k => `<button class="opt" type="button" data-must="${k}" aria-pressed="${S.must.includes(k)}">${esc(SHORT[k])}</button>`).join('')}</div>
      <div class="row"><span class="lbl">Type</span>${['All','Agent','Framework'].map(t => `<button class="opt" type="button" data-type="${t}" aria-pressed="${S.type===t}">${t==='All'?'All':t+'s'}</button>`).join('')}</div>
      <div class="row"><span class="lbl">Sort</span>${[['rank','Rank'],['momentum','Momentum'],['reviews','Most reviewed']].map(([v,l]) => `<button class="opt" type="button" data-sort="${v}" aria-pressed="${S.sort===v}">${l}</button>`).join('')}</div>
    </div>
    <div class="count"><button class="linkbtn" id="reset" type="button" ${nf||S.industry!=='All'||S.q?'':'hidden'}>Clear all</button></div>
    <div class="list" id="rows" role="list"></div>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (b.disabled) return; S.period = b.dataset.p; document.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows(true); });
  document.querySelectorAll('[data-ind]').forEach(b => b.onclick = () => { S.industry = b.dataset.ind; document.querySelectorAll('[data-ind]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows(true); syncReset(); });
  $('#q').oninput = e => { S.q = e.target.value; renderRows(true); syncReset(); };
  $('#fbtn').onclick = () => { S.fopen = !S.fopen; $('#fpanel').hidden = !S.fopen; $('#fbtn').setAttribute('aria-expanded', S.fopen); };
  const setOpt = (attr, key, multi) => document.querySelectorAll(`[${attr}]`).forEach(b => b.onclick = () => {
    const v = b.getAttribute(attr);
    if (multi) { S.must = S.must.includes(v) ? S.must.filter(x => x !== v) : [...S.must, v]; b.setAttribute('aria-pressed', S.must.includes(v)); }
    else { S[key] = v; document.querySelectorAll(`[${attr}]`).forEach(x => x.setAttribute('aria-pressed', x === b)); }
    renderRows(true); syncReset();
  });
  setOpt('data-must', 'must', true); setOpt('data-type', 'type'); setOpt('data-sort', 'sort');
  $('#reset').onclick = () => { Object.assign(S, {industry:'All', type:'All', must:[], q:'', sort:'rank'}); viewIndex(); };
  renderRows(false);
}
function syncReset(){
  const nf = S.must.length + (S.type !== 'All') + (S.sort !== 'rank');
  $('#fbtn').textContent = 'Filters' + (nf ? ` · ${nf}` : ''); $('#fbtn').classList.toggle('has', !!nf);
  $('#reset').hidden = !(nf || S.industry !== 'All' || S.q);
}

function renderRows(animate){
  const box = $('#rows'); if (!box) return;
  const before = {};
  if (animate && !reduced()) box.querySelectorAll('.item').forEach(el => before[el.dataset.id] = el.getBoundingClientRect().top);
  const list = filtered();
  const back = PERIODS.find(p => p[0] === S.period)[2];
  const pn = $('#pnote');
  if (pn) {
    const wk = dayAt(7);
    pn.textContent = S.period === 'now'
      ? (wk && wk !== S.hist.latest ? `Arrows show movement since ${nice(wk)}.` : '')
      : `The ranking as it stood on ${nice(dayAt(back))}.`;
  }
  box.innerHTML = list.length ? list.map((a, i) => `
    <a class="item ${a.rank<=3?'top3':''} ${S.first?'enter':''}" role="listitem" data-id="${esc(a.id)}" href="${a._gone?'#index':'#agent-'+esc(a.id)}" style="${S.first?`animation-delay:${Math.min(i,12)*35}ms`:''}">
      <div class="rk"><b>${a.rank}</b>${a._mv ? `<span class="mv ${a._mv.cls}">${esc(a._mv.txt)}</span>` : ''}</div>
      <div class="nm"><b>${esc(a.name)}</b><span>${esc(a.description)}</span></div>
      <div class="sc"><span class="v">${a.score} <small>of 12</small></span><div class="bar"><i style="width:${a.score/12*100}%"></i></div>${userScore(a.id) ? `<span class="us tnum">${userScore(a.id).pct}% · ${userScore(a.id).n} review${userScore(a.id).n===1?'':'s'}</span>` : ''}</div>
      <span class="chev" aria-hidden="true">›</span>
    </a>`).join('') : `<div class="empty"><h3>No agents match</h3>Try another industry or remove a filter.</div>`;
  S.first = false;
  if (animate && !reduced()) box.querySelectorAll('.item').forEach(el => {
    const was = before[el.dataset.id], now = el.getBoundingClientRect().top;
    if (was == null) { el.animate([{opacity:.3, transform:'translateY(10px)'},{opacity:1, transform:'none'}], {duration:380, easing:'cubic-bezier(.2,.7,.2,1)'}); return; }
    if (Math.abs(was - now) > 1) el.animate([{transform:`translateY(${was-now}px)`},{transform:'none'}], {duration:520, easing:'cubic-bezier(.2,.7,.2,1)'});
  });
}

/* ---------- compare ---------- */
function toggleCmp(id){
  if (S.cmp.includes(id)) S.cmp = S.cmp.filter(x => x !== id);
  else { if (S.cmp.length >= 3) S.cmp.shift(); S.cmp.push(id); }
  store.set('vaq-cmp', S.cmp); renderTray();
}
function renderTray(){
  const on = S.cmp.length > 0 && location.hash !== '#compare';
  $('#tray').classList.toggle('on', on);
  const names = S.cmp.map(id => (S.agents.find(a => a.id === id) || {}).name).filter(Boolean);
  $('#trayTxt').textContent = names.length === 1 ? `${names[0]} · add one more` : names.join(', ');
}
function viewCompare(){
  const list = S.cmp.map(id => S.agents.find(x => x.id === id)).filter(Boolean);
  if (list.length < 2) { $('#app').innerHTML = `<a class="back" href="#index">‹ Rankings</a><div class="empty"><h3>Add two or three agents to compare</h3>Open an agent and choose “Compare”.</div>`; return; }
  const best = Math.max(...list.map(a => a.score));
  const groups = [...new Set(S.run.checks.map(c => c.group))];
  const yn = v => v ? '<span class="yes">✓</span>' : '<span class="no">—</span>';
  $('#app').innerHTML = `<a class="back" href="#index">‹ Rankings</a>
    <div style="padding-top:28px"><h1>Compare</h1></div>
    <div class="cmpwrap"><table class="cmpt">
      <thead><tr><th></th>${list.map(a => `<th><a href="#agent-${esc(a.id)}" style="color:var(--ink);font-size:19px;font-weight:600">${esc(a.name)}</a>
        <div class="${a.score===best?'bestc':''}" style="font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin-top:6px">${a.score}<span style="font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0"> of 12</span></div>
        <button class="linkbtn" type="button" data-un="${esc(a.id)}">Remove</button></th>`).join('')}</tr></thead>
      <tbody>${groups.map(g => `<tr class="g"><th colspan="${list.length+1}">${esc(g)}</th></tr>` + S.run.checks.filter(c => c.group === g).map(c => `<tr><th>${esc(c.question)}</th>${list.map(a => `<td>${yn(a.checks[c.id].answer)}</td>`).join('')}</tr>`).join('')).join('')}
        <tr class="g"><th colspan="${list.length+1}">How to get it</th></tr>
        <tr><th>Managed provider</th>${list.map(a => `<td>${yn((a.get_it.listed_managers||[]).length || provs(a.id,'managed').length)}</td>`).join('')}</tr>
        <tr><th>Reseller</th>${list.map(a => `<td>${yn(a.get_it.listed_resellers.length || provs(a.id,'reseller').length)}</td>`).join('')}</tr>
        <tr><th>Hosted version</th>${list.map(a => `<td>${yn(a.get_it.hosted_by_maker.answer || a.get_it.marketplaces.length || provs(a.id,'host').length)}</td>`).join('')}</tr>
        <tr><th>Open source</th>${list.map(a => `<td>${yn(a.get_it.open_source)}</td>`).join('')}</tr>
        <tr class="g"><th colspan="${list.length+1}">People</th></tr>
        <tr><th>User reviews</th>${list.map(a => `<td class="small">${revTxt(a.id)}</td>`).join('')}</tr>
      </tbody></table></div>`;
  document.querySelectorAll('[data-un]').forEach(b => b.onclick = () => { toggleCmp(b.dataset.un); viewCompare(); });
}

/* ---------- providers ---------- */
const KIND = {managed:'Managed agent provider', host:'Hosting platform', reseller:'Reseller', referral:'Referral partner'};
const provs = (id, kind) => (S.providers||[]).filter(p => (!kind || (p.kinds||[]).includes(kind)) && (p.agents === 'all' || (p.agents||[]).includes(id)));
const plink = p => `<a href="#provider-${esc(p.slug)}">${esc(p.name)}</a>`;

  const p = (S.providers||[]).find(x => x.slug === slug);

  const agents = p.agents === 'all' ? S.agents : S.agents.filter(a => (p.agents||[]).includes(a.id));
  $('#app').innerHTML = `<a class="back" href="#claim">‹ For providers</a>
    <section class="ahead"><div style="min-width:0">

      ${p.description ? `<p>${esc(p.description)}</p>` : ''}

    </div></section>
    ${(p.sections||[]).map(sec => `<section class="sec-block psec"><h2>${esc(sec.heading)}</h2>${sec.lead ? `<p class="lead">${esc(sec.lead)}</p>` : ''}${sec.steps ? `<ol>${sec.steps.map(i => `<li>${esc(i)}</li>`).join('')}</ol>` : ''}${sec.items ? `<ul>${sec.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}</section>`).join('')}
    <section class="sec-block"><h2>Agents from this ranking they ${(p.kinds||[]).includes('host') ? 'run or host' : 'work with'}</h2>
      ${agents.length ? `<div class="list" style="margin-top:22px">${agents.map(a => `<a class="item" href="#agent-${esc(a.id)}"><div class="rk"><b>${a.rank}</b></div><div class="nm"><b>${esc(a.name)}</b><span>${esc(a.description)}</span></div><div class="sc"><span class="v">${a.score} <small>of 12</small></span></div><span class="chev" aria-hidden="true">›</span></a>`).join('')}</div>` : `<p class="lead">${esc(p.agents_note || 'No agents listed yet.')}</p>`}
    </section>`;
  $('#pmg').onclick = () => { S.pickProvider = p.slug; S.pick = null; };
  window.scrollTo(0,0);
}
function providerDirectory(){
  const list = S.providers || [];
  if (!list.length) return '';
  return `<section class="sec-block"><h2>Listed providers</h2><p class="lead">Companies that run, host or resell agents on this list.</p>
    <div class="pgrid">${list.map(p => `<a class="card pcard" href="#provider-${esc(p.slug)}"><b>${esc(p.name)}</b><span>${(p.kinds||[]).map(k => esc(KIND[k]||k)).join(' · ')}</span></a>`).join('')}</div></section>`;
}

/* ---------- agent page ---------- */
function histBlock(a){
  const pts = Object.keys(S.hist.days).sort().map(d => ({d, r: (S.hist.days[d].find(x => x.id === a.id) || {}).rank})).filter(p => p.r);
  const at = d => d && d !== S.hist.latest ? ((S.hist.days[d].find(x => x.id === a.id) || {}).rank) : undefined;
  const cell = (label, d) => { const ok = d && d !== S.hist.latest, r = at(d); return `<div>${label}<b>${ok ? (r ? '#' + r : 'Not listed') : '—'}</b></div>`; };
  let chart;
  if (pts.length >= 2) {
    const W = 600, H = 120, max = Math.max(...pts.map(p => p.r), 10);
    const xy = pts.map((p,i) => [i/(pts.length-1)*(W-20)+10, (p.r-1)/(max-1)*(H-20)+10]);
    chart = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Rank over time"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${xy.map(p=>p.join(',')).join(' ')}"/></svg>`;
  } else chart = '';
  return `<div class="hist">${chart}<div class="hrow"><div>Today<b>#${a.rank}</b></div>${cell('Last week', dayAt(7))}${cell('1 month ago', dayAt(30))}<div>Days on the list<b>${pts.length}</b></div></div></div>`;
}
function userScore(id){
  const l = (S.reviews||{})[id] || [];
  if (!l.length) return null;
  let yes = 0, all = 0;
  l.forEach(r => QS.forEach(([k]) => { if (r[k]) { all++; if (r[k] === 'yes') yes++; } }));
  return { pct: all ? Math.round(100 * yes / all) : 0, n: l.length };
}
function revTxt(id){
  const u = userScore(id);
  return u ? `${u.pct}% positive · ${u.n} review${u.n>1?'s':''}` : 'No reviews yet';
}
function userBig(id){
  const u = userScore(id);
  return u ? `<b>${u.pct}%</b><span>user score · ${u.n} review${u.n>1?'s':''}</span>` : `<a href="#reviews" class="rvlink">No reviews yet</a>`;
}
function viewAgent(id){
  const a = S.agents.find(x => x.id === id);
  if (!a) { $('#app').innerHTML = `<a class="back" href="#index">‹ Rankings</a><div class="empty"><h3>This agent isn't on this week's list</h3></div>`; return; }
  const meta = Object.fromEntries(S.run.checks.map(c => [c.id, c]));
  const groups = [...new Set(S.run.checks.map(c => c.group))];
  const g = a.get_it, mv = movement(a.id, a.rank), inCmp = S.cmp.includes(a.id);
  const yesno = b => b ? '<span class="yes">Yes</span>' : '<span class="no">No</span>';
  const proof = v => `<div class="proof">“${esc(v.quote)}”<cite><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(host(v.url))}${esc(new URL(v.url).pathname.slice(0,48))}</a></cite></div>`;
  $('#app').innerHTML = `
    <a class="back" href="#index">‹ Rankings</a>
    <section class="ahead">
      <div style="min-width:0">
        <div class="eyebrow">#${a.rank} · ${esc(a.industry)}${mv ? ` · <span class="mv ${mv.cls}">${esc(mv.txt)}</span>` : ''}</div>
        <h1 style="margin-top:10px">${esc(a.name)}</h1>
        <p>${esc(a.description)}</p>
        <div class="acts">
          <a class="btn" href="#manage" id="mg">Manage it for me</a>
          <button class="btn sec" type="button" id="cmpb">${inCmp ? '✓ Comparing' : 'Compare'}</button>
          ${a.url ? `<a class="txt" href="${esc(a.url)}" target="_blank" rel="noopener">Website ›</a>` : ''}
          ${a.repo_url ? `<a class="txt" href="${esc(a.repo_url)}" target="_blank" rel="noopener">Code ›</a>` : ''}
        </div>
      </div>
      <div class="big"><b>${a.score}</b><span>of 12 checks passed</span><div class="ubig" id="ubig">${userBig(a.id)}</div></div>
    </section>
    <div class="strip">${groups.map(gr => { const ks = ORDER.filter(k => meta[k].group === gr), y = ks.filter(k => a.checks[k].answer).length; return `<div><div class="k">${esc(gr)}</div><div class="v">${y} of ${ks.length}</div><div class="bar"><i style="width:${y/ks.length*100}%"></i></div></div>`; }).join('')}</div>

    <section class="sec-block" id="checks"><h2>The 12 checks</h2><p class="lead">A Yes needs a quote from a public page. No evidence counts as No.</p>
      <div class="checks">${ORDER.map(k => { const v = a.checks[k]; return v.answer
        ? `<details class="ck"><summary><span class="dot y" aria-hidden="true">✓</span><span>${esc(meta[k].question)} <span class="grp">${esc(meta[k].group)}</span></span><span class="more">Proof</span></summary>${proof(v)}</details>`
        : `<div class="ck"><div class="static" style="display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 2px"><span class="dot n" aria-hidden="true">–</span><span>${esc(meta[k].question)} <span class="grp">${esc(meta[k].group)}</span></span><span class="no">No</span></div></div>`; }).join('')}</div>
    </section>

    <section class="sec-block" id="getit"><h2>How to get it <span class="tag-ns">Not scored</span></h2>
      <div class="callout"><div><h3>Manage it for me</h3><p>${provs(a.id,'managed').length ? `Run for customers by ${provs(a.id,'managed').map(plink).join(', ')}.` : (g.listed_managers||[]).length ? esc(g.listed_managers.join(', ')) : 'A provider sets it up and keeps it running for a monthly fee.'}</p></div><a class="btn" href="#manage" id="mg2">Request a provider</a></div>
      <div class="rows">
        <div class="r"><div><div class="k">Who resells it?</div><div class="h">${[...provs(a.id,'reseller').map(plink), ...g.listed_resellers.map(esc)].join(', ') || 'No reseller listed yet.'} <a href="#claim">Resell it ›</a></div></div></div>
        <div class="r"><div><div class="k">Maker has a reseller program</div></div>${yesno(g.reseller_program.answer)}</div>
        <div class="r"><div><div class="k">Referral only?</div><div class="h">They pay referrals but don't let you resell it.</div></div>${yesno(g.referral_program.answer && !g.reseller_program.answer && !g.listed_resellers.length)}</div>
        <div class="r"><div><div class="k">Hosted on</div><div class="h">${[g.hosted_by_maker.answer ? "The maker's cloud" : null, ...g.marketplaces.map(esc), ...provs(a.id,'host').map(plink)].filter(Boolean).join(' · ') || 'No hosted version found.'}</div></div>${yesno(g.hosted_by_maker.answer || g.marketplaces.length || provs(a.id,'host').length)}</div>
        <div class="r"><div><div class="k">Bring it to your platform</div><div class="h">${[g.open_source ? 'Open source' : null, g.self_host ? 'Self-host' : null, ...g.bring_your_own].filter(Boolean).map(esc).join(' · ') || 'No integration paths found.'}</div></div></div>
      </div>
    </section>

    <section class="sec-block" id="history"><h2>Rank over time</h2>${histBlock(a)}</section>

    ${reviewsPanel(a)}

    <section class="sec-block" id="why"><h2>Why it's trending</h2>
      <ul class="src">${a.mention_links.map(m => `<li><span class="muted small">${esc(m.source)} · ${esc(m.date)}</span><br><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></li>`).join('')}</ul>
      <div class="callout"><div><h3>Is this your agent?</h3><p>Claim the listing to add evidence. You can't edit answers or scores.</p></div><a class="btn sec" href="#claim">Claim it</a></div>
    </section>`;
  const pickMe = () => { S.pick = a.id; S.pickProvider = null; };
  $('#mg').onclick = pickMe; $('#mg2').onclick = pickMe;
  $('#cmpb').onclick = () => { toggleCmp(a.id); $('#cmpb').textContent = S.cmp.includes(a.id) ? '✓ Comparing' : 'Compare'; };
  bindReviews(a);
  window.scrollTo(0,0);
}

/* ---------- method + forms ---------- */
function viewMethod(){
  const groups = [...new Set(S.run.checks.map(c => c.group))];
  $('#app').innerHTML = `<div class="page">
    <div class="eyebrow">Rubric v${esc(S.run.rubric_version)}</div>
    <h1 style="margin-top:12px">How we score</h1>
    <p class="muted" style="font-size:19px;margin-top:16px">An agent gets on the list by trending and gets its rank from twelve yes/no checks. The same evidence always gives the same rank.</p>
    <h2>Who gets listed</h2>
    <p>An agent joins when it is mentioned ${(S.run.min_sources_applied || S.run.min_sources_requested) === 1 ? 'on GitHub, Hacker News or Reddit' : `on at least ${S.run.min_sources_applied || S.run.min_sources_requested} of GitHub, Hacker News and Reddit`} in the last ${S.run.window_days} days. The list shows the top 50 by mentions, then by stars gained.</p>
    <h2>The 12 checks</h2>
    <p>Each check is Yes or No. A Yes needs a quote on a public page. Unknown counts as No.</p>
    <div class="rubric">${groups.map(g => `<div><b>${esc(g)}</b><ol>${S.run.checks.filter(c=>c.group===g).map(c=>`<li>${esc(c.question)}</li>`).join('')}</ol></div>`).join('')}</div>
    <h2>Order</h2>
    <ul><li>Score is the number of Yes answers out of 12. Every check counts the same.</li><li>Ties go to more mentions, then more stars gained, then name A to Z.</li></ul>
    <h2>History</h2>
    <p>Every daily run is saved. Movement arrows compare today with a week ago, and the archive shows past rankings exactly as they stood. Nothing is estimated or back-filled.</p>
    <h2>The rules</h2>
    <ul><li>No one pays for rank. Managed providers, resellers and hosting never change a score.</li><li>User reviews are shown next to the score and never change it.</li><li>Makers can add evidence, not edit answers or scores.</li><li>Rubric changes get a new version number and date.</li><li>The scraper reads public pages only and respects robots.txt.</li></ul>
    <h2>Known limits</h2>
    <p>Checks match text, so unusual wording can read as No, and an aside can occasionally read as Yes. Makers can fix both by claiming their listing.</p>
  </div>`;
}
function formShell(eyebrow, title, lede, formHtml, asideTitle, items, kind, doneMsg, extra){
  $('#app').innerHTML = `<div class="page" style="max-width:none"><div style="max-width:640px"><div class="eyebrow">${eyebrow}</div><h1 style="margin-top:12px">${title}</h1>${lede ? `<p class="muted" style="font-size:19px;margin-top:16px">${lede}</p>` : ''}</div>
    <div class="formgrid"><form class="card" id="f" novalidate>${formHtml}<label style="position:absolute;left:-9999px" aria-hidden="true">Website<input id="hp_url" tabindex="-1" autocomplete="off"></label><div id="done" hidden></div></form>
    <div style="padding:8px 4px"><h3>${asideTitle}</h3><ul style="padding-left:18px;color:var(--muted)">${items.map(i => `<li style="margin:8px 0">${i}</li>`).join('')}</ul></div></div>${extra || ''}</div>`;
  const form = $('#f');
  form.onsubmit = async e => {
    e.preventDefault();
    const bad = [...form.querySelectorAll('[required]')].find(i => !i.value.trim() || (i.type==='email' && !/^\S+@\S+\.\S+$/.test(i.value)));
    const d = $('#done'); d.hidden = false;
    if (bad) { d.className = 'msg'; d.textContent = bad.type === 'email' ? 'Enter a valid email address.' : 'Fill in every required field.'; bad.focus(); return; }
    const btn = form.querySelector('button[type="submit"]'); btn.disabled = true; d.className = 'msg'; d.textContent = 'Sending…';
    const payload = { kind };
    form.querySelectorAll('input,select,textarea').forEach(i => { if (i.id) payload[i.id] = i.value; });
    try {
      const res = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { d.textContent = out.error && out.error !== 'unavailable' ? out.error : "That didn't send. Check your connection and try again."; return; }
      d.className = 'ok'; d.textContent = doneMsg;
      form.querySelectorAll('input:not([type=hidden]),textarea').forEach(i => { i.value = ''; });
    } catch { d.textContent = "That didn't send. Check your connection and try again."; }
    finally { btn.disabled = false; }
  };
}
const agentOptions = sel => S.agents.map(a => `<option value="${esc(a.id)}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
const industryOptions = () => allIndustries().map(i => `<option>${esc(i)}</option>`).join('');
const viewManage = () => { const pv = (S.providers||[]).find(p => p.slug === S.pickProvider); formShell('Managed agents', 'Manage it for me', pv ? `This request goes to ${esc(pv.name)}. Tell us what you need done and, if you know it, which agent.` : 'Tell us what you need done and, if you know it, which agent. A provider who already runs it for other customers will set it up and keep it running for a monthly fee.',
  `<label for="magent">Agent<select id="magent"><option value="general" ${S.pick ? '' : 'selected'}>General request (no specific agent)</option>${agentOptions(S.pick)}</select></label><label for="mjob">The job you want done<textarea id="mjob" rows="3" required placeholder="Draft first-pass proposal responses from our past bids"></textarea></label><div class="two"><label for="mco">Company<input id="mco" required autocomplete="organization"></label><label for="mem">Work email<input id="mem" type="email" required autocomplete="email"></label></div><input type="hidden" id="provider" value="${esc(S.pickProvider || '')}"><button class="btn" type="submit">Request a provider</button>`,
  'What managed includes', ["Setup in your environment or the provider's.", 'Monitoring, fixes and updates.', 'A named person you can call.', "Your provider never changes an agent's rank."], 'manage', "Sent. A provider will be in touch at the email you gave."); };
const viewClaim = () => formShell('For makers, providers and resellers', 'Claim a listing', 'Makers add evidence to their agent page. Providers, hosts and resellers list the agents they work with and get a page of their own. None of it changes the score.',
  `<label for="role">I am<select id="role"><option>The maker of this agent</option><option>A provider who manages it for customers</option><option>A platform that can host it</option><option>A reseller who sells it</option><option>A referral partner</option></select></label><label for="agent">Agent<select id="agent"><option value="multiple" ${S.pick ? '' : 'selected'}>More than one agent</option>${agentOptions(S.pick)}</select></label><div class="two"><label for="co">Company<input id="co" required autocomplete="organization"></label><label for="em">Work email<input id="em" type="email" required autocomplete="email"></label></div><label for="web">Website<input id="web" type="url" placeholder="https://" autocomplete="url"></label><label for="about">About your company, for your provider page<textarea id="about" rows="3" maxlength="600" placeholder="What you do, who you do it for, and how you work with these agents."></textarea></label><label for="ev">Evidence links, one per line<textarea id="ev" rows="3" placeholder="https://yourcompany.com/security"></textarea></label><button class="btn" type="submit">Submit claim</button>`,
  'What happens next', ['We confirm you work for the company.', 'New evidence is re-checked against the same 12 rules.', 'Providers, hosts and resellers get a page and appear under “How to get it”.'], 'claim', "Sent. We'll confirm the claim and be in touch.", providerDirectory());
const viewPulse = () => formShell('Daily email', 'Agent Pulse', '',
  `<label for="pem">Email<input id="pem" type="email" required autocomplete="email"></label><label for="pind">Industries<select id="pind"><option>All industries</option>${industryOptions()}</select></label><button class="btn" type="submit">Subscribe</button>`,
  "What's in it", ['Biggest movers by industry.', 'New agents on the list.', 'Checks that flipped from No to Yes.'], 'pulse', "You're subscribed.");

/* ---------- reviews (shared, stored outside the page) ---------- */
S.reviews = {}; S.dbState = 'loading';
const QS = [['did_job','Did it do the job you needed?'],['production','Running in production today?'],['recommend','Would you recommend it?'],['fast_setup','Live in under a week?'],['cost_ok','Cost what you expected?']];
const ROLES = ['Executive','Operations','IT / Security','Engineering','Sales / Marketing','Finance / Legal','Other'];
const SIZES = ['1–49','50–249','250–999','1,000–4,999','5,000+'];
const RUNS = ['I run it myself',"The maker's hosted version",'Managed by a provider','Bought through a reseller'];
const yn = v => v === 'yes' ? 'yes' : v === 'no' ? 'no' : null;
const pick = (v, list) => list.includes(v) ? v : null;
function reviewsPanel(a){
  return `<section class="sec-block" id="reviews"><h2>What users say <span class="tag-ns">Not scored</span></h2>
    <p class="lead">Yes/no reviews from people who use it. Reviewers stay anonymous. The user score is the share of Yes answers across every review.</p>
    <div id="rvBody"></div><div id="rvAction"></div>
    <form id="rf" hidden novalidate>
      <div class="two">
        <label for="rv-role">Your role<select id="rv-role"><option value="">Choose…</option>${ROLES.map(r => `<option>${esc(r)}</option>`).join('')}</select></label>
        <label for="rv-size">Company size<select id="rv-size"><option value="">Choose…</option>${SIZES.map(r => `<option>${esc(r)}</option>`).join('')}</select></label>
        <label for="rv-run">How you use it<select id="rv-run"><option value="">Choose…</option>${RUNS.map(r => `<option>${esc(r)}</option>`).join('')}</select></label>
      </div>
      <label for="rv-job">The job you use it for<input id="rv-job" maxlength="120" placeholder="Triage inbound security alerts"></label>
      <label style="position:absolute;left:-9999px" aria-hidden="true">Website<input id="rv-website" tabindex="-1" autocomplete="off"></label>
      <div>${QS.map(([k,q]) => `<div class="ynq" role="radiogroup" aria-label="${esc(q)}"><span>${esc(q)}</span><span class="opts"><input type="radio" name="rv-${k}" id="rv-${k}-y" value="yes"><label for="rv-${k}-y">Yes</label><input type="radio" name="rv-${k}" id="rv-${k}-n" value="no"><label for="rv-${k}-n">No</label></span></div>`).join('')}</div>
      <label for="rv-comment">What should others know? (optional)<textarea id="rv-comment" rows="3" maxlength="600"></textarea></label>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit" id="rv-save">Post review</button><button class="btn sec" type="button" id="rv-cancel">Cancel</button></div>
      <div id="rv-msg" class="msg" hidden></div>
    </form></section>`;
}
function fillReviews(a){
  const body = $('#rvBody'); if (!body) return;
  if (S.dbState === 'loading') body.innerHTML = '<p class="muted" style="margin-top:20px">Loading reviews…</p>';
  else if (S.dbState === 'off') body.innerHTML = '<p class="muted" style="margin-top:20px">Reviews aren\'t loading right now. Refresh to try again.</p>';
  else {
    const l = S.reviews[a.id] || [];
    body.innerHTML = !l.length ? '<p class="muted" style="margin-top:20px">No reviews yet. If you use this agent, be the first.</p>' : `
      <div class="qgrid">${QS.map(([k,q]) => { const y = l.filter(r => r[k] === 'yes').length, p = Math.round(100*y/l.length); return `<div class="qstat"><div class="k">${esc(q)}</div><div class="v">${p}%</div><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join('')}</div>
      <div style="margin-top:12px">${l.map(r => `<div class="review"><div class="who">${esc(r.role || 'Reviewer')} · ${esc(r.size || '')} employees · ${esc(r.run || '')}${r.uid === S.uid ? ' · Your review' : ''} · ${esc(String(r.ts || '').slice(0,10))}</div>
        ${r.job ? `<div style="font-weight:600;margin-top:6px">Uses it for: ${esc(r.job)}</div>` : ''}
        <div class="yn">${QS.map(([k,q]) => r[k] ? `<span class="pill ${r[k]==='yes'?'y':'n'}">${esc(q.replace('?',''))}: ${r[k]==='yes'?'Yes':'No'}</span>` : '').join('')}</div>
        ${r.comment ? `<p>${esc(r.comment)}</p>` : ''}</div>`).join('')}</div>`;
  }
  const act = $('#rvAction'), form = $('#rf');
  if (!act || !form || !form.hidden) return;
  const mine = (S.reviews[a.id] || []).find(r => r.uid === S.uid);
  act.innerHTML = S.dbState !== 'ok' ? '' : `<button class="btn sec" type="button" id="rv-open" style="margin-top:18px">${mine ? 'Update your review' : 'Leave a review'}</button>`;
  const open = $('#rv-open');
  if (open) open.onclick = () => {
    form.hidden = false; act.innerHTML = '';
    if (mine) { $('#rv-role').value = mine.role || ''; $('#rv-size').value = mine.size || ''; $('#rv-run').value = mine.run || ''; $('#rv-job').value = mine.job || ''; $('#rv-comment').value = mine.comment || '';
      QS.forEach(([k]) => { const el = document.getElementById(`rv-${k}-${mine[k]==='yes'?'y':'n'}`); if (mine[k] && el) el.checked = true; }); }
    $('#rv-role').focus();
  };
}
function bindReviews(a){
  fillReviews(a);
  const form = $('#rf'); if (!form) return;
  $('#rv-cancel').onclick = () => { form.hidden = true; fillReviews(a); };
  form.onsubmit = async e => {
    e.preventDefault();
    const msg = $('#rv-msg'); msg.hidden = false;
    const r = { role: pick($('#rv-role').value, ROLES), size: pick($('#rv-size').value, SIZES), run: pick($('#rv-run').value, RUNS), job: $('#rv-job').value.trim().slice(0,120), comment: $('#rv-comment').value.trim().slice(0,600), ts: new Date().toISOString() };
    QS.forEach(([k]) => { r[k] = yn((form.querySelector(`input[name="rv-${k}"]:checked`) || {}).value); });
    if (!r.role || !r.size || !r.run) { msg.textContent = 'Choose your role, company size and how you use it.'; return; }
    if (QS.some(([k]) => !r[k])) { msg.textContent = 'Answer all five yes/no questions.'; return; }
    const btn = $('#rv-save'); btn.disabled = true; msg.textContent = 'Posting…';
    try {
      const res = await fetch('/api/reviews', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...r, agent: a.id, uid: S.uid, website: $('#rv-website').value }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { msg.textContent = out.error && out.error !== 'unavailable' ? out.error : "Your review didn't save. Check your connection and post again."; return; }
      const l = (S.reviews[a.id] = (S.reviews[a.id] || []).filter(x => x.uid !== S.uid)); l.unshift(out.review);
      form.hidden = true; msg.hidden = true; fillReviews(a); const ub = $('#ubig'); if (ub) ub.innerHTML = userBig(a.id);
    } catch {
      msg.textContent = "Your review didn't save. Check your connection and post again.";
    } finally { btn.disabled = false; }
  };
}
function refreshReviews(){
  const h = location.hash.slice(1);
  if (h.startsWith('agent-')) { const a = S.agents.find(x => x.id === h.slice(6)); if (a) { fillReviews(a); const ub = $('#ubig'); if (ub) ub.innerHTML = userBig(a.id); } }
  if (h === 'compare') viewCompare();
  if (!h || h === 'index') renderRows(false);
}
function getUid(){
  let u = store.get('var-uid');
  if (!/^[a-f0-9]{32}$/.test(u || '')) { u = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2,'0')).join(''); store.set('var-uid', u); }
  return u;
}
async function initReviews(){
  S.uid = getUid();
  try {
    const res = await fetch('/api/reviews', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const { byAgent } = await res.json();
    S.reviews = {};
    Object.entries(byAgent || {}).forEach(([aid, l]) => { if (S.agents.some(x => x.id === aid)) S.reviews[aid] = l; });
    S.dbState = 'ok';
  } catch { S.dbState = 'off'; }
  refreshReviews();
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1) || 'index';
  const section = h.startsWith('agent-') || h === 'compare' ? 'index' : h === 'manage' || h.startsWith('provider-') ? 'claim' : h;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === section) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (h.startsWith('agent-')) viewAgent(h.slice(6));
  else if (h.startsWith('provider-')) viewProvider(h.slice(9));
  else if (h === 'compare') viewCompare();
  else if (h === 'method') viewMethod();
  else if (h === 'claim') viewClaim();
  else if (h === 'manage') viewManage();
  else if (h === 'pulse') viewPulse();
  else viewIndex();
  renderTray();
  if (!h.startsWith('agent-') && !h.startsWith('provider-')) window.scrollTo(0,0);
}
Promise.all(['agents.json','run.json','history.json'].map(f => fetch(f).then(r => r.json())).concat([fetch('providers.json').then(r => r.ok ? r.json() : []).catch(() => [])]))
  .then(([agents, run, hist, providers]) => {
    S.agents = agents; S.run = run; S.hist = hist; S.providers = Array.isArray(providers) ? providers : [];
    S.cmp = (store.get('vaq-cmp') || []).filter(id => agents.some(a => a.id === id)).slice(0,3);
    $('#footStamp').textContent = `Updated ${nice(hist.latest)}`;
    $('#trayClear').onclick = () => { S.cmp = []; store.set('vaq-cmp', []); renderTray(); };
    route(); addEventListener('hashchange', route);
    initReviews();
  })
  .catch(() => { $('#app').innerHTML = '<div class="empty"><h3>The rankings didn\'t load</h3>Refresh the page to try again.</div>'; });
</script>
</body>
</html>
